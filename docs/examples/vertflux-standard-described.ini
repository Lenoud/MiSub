; Vertflux 标准分流（含策略说明）
; 复制自 2026-10-21 的内置 Standard 分流，当前地区为美国、香港。
; 节点由订阅组动态注入，本模板不保存服务器地址、密码或节点 UUID。
; 前置代理继续在订阅组的「节点前置代理」中配置。
; 选择此模板时使用完全自定义规则，不额外叠加内置分流。
; 自动选择：每 300 秒检测连通性与延迟，优先低延迟；50 ms 容差减少反复切换。
; 故障转移：按节点排列顺序使用首个可用节点；不是自动选择最低延迟。
; 节点选择：手动选择策略组或 DIRECT；手动切换：固定选择某个节点。
; 地区组：手动选择该地区自动测速，或固定选择该地区的单个节点。
; 服务组：只处理命中对应规则的流量；规则按从上到下的顺序匹配。
; OpenAI 补充：登录验证等远程补充规则，可能包含多家网站共用的服务域名。
; Telegram 保留与 Standard 相同的预留组；本版未为其绑定独立分流规则。

[custom]

; 策略组：名称中的括号说明直接显示在 Clash 客户端。
