name: Vertflux 构建检查与部署

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: '检查通过后部署到现有 Cloudflare 项目（仅生产分支有效）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vertflux-cloudflare-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 构建与检查
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 运行测试
        run: npm run test:run
      - name: 构建前端和 Pages Functions
        env:
          VITE_VERTFLUX_SSO: 'true'
        run: |
          npm run build
          npx --no-install wrangler pages functions build functions --outdir .wrangler/functions-check --compatibility-date 2026-10-21 --compatibility-flags nodejs_compat
      - name: 初始化或检查数据库表结构
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bf8566234d0f57c2451986e3cdcb01c4
        run: npx --no-install wrangler d1 execute MISUB_DB --remote --file schema.sql
      - name: 同步应用加密配置
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bf8566234d0f57c2451986e3cdcb01c4
          ADMIN_PASSWORD: ${{ secrets.MISUB_ADMIN_PASSWORD }}
          COOKIE_SECRET: ${{ secrets.MISUB_COOKIE_SECRET }}
          CRON_SECRET: ${{ secrets.MISUB_CRON_SECRET }}
        run: |
          node -e 'const names=["ADMIN_PASSWORD","COOKIE_SECRET","CRON_SECRET"];if(names.some(n=>!process.env[n]))process.exit(1);process.stdout.write(JSON.stringify(Object.fromEntries(names.map(n=>[n,process.env[n]]))))' | npx --no-install wrangler pages secret bulk --project-name vertflux-sub
      - name: 发布到 Cloudflare Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bf8566234d0f57c2451986e3cdcb01c4
        run: npx --no-install wrangler pages deploy dist --project-name vertflux-sub --branch main --commit-hash "$GITHUB_SHA"
      - name: 验证生产入口
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        run: |
          test "$(curl --silent --show-error --retry 5 --retry-delay 3 --max-time 30 --output /dev/null --write-out '%{http_code}' https://sub.vertflux.com/dashboard)" = 302
          test "$(curl --silent --show-error --retry 5 --retry-delay 3 --max-time 30 --output /dev/null --write-out '%{http_code}' https://sub.vertflux.com/api/settings)" = 401
      - name: 关闭接入 SSO 前的历史部署入口
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/scripts/vertflux-close-legacy.py
